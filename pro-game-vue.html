<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Про Кликер Vuetify</title>
    <!-- Подключаем шрифты и иконки для Vuetify -->
    <link href="https://fonts.googleapis.com/css?family=Roboto:100,300,400,500,700,900" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@mdi/font@5.x/css/materialdesignicons.min.css" rel="stylesheet">
    <!-- Подключаем саму библиотеку Vuetify -->
    <link href="https://cdn.jsdelivr.net/npm/vuetify@3.3.0/dist/vuetify.min.css" rel="stylesheet">
    <style>
        /* Добавление фона*/
        .v-application { background: #f5f5f5; }
    </style>
</head>
<body>
    <!-- Наше приложение Vue -->
    <div id="app">
        <!-- v-app — корневой контейнер Vuetify -->
        <v-app>
            <v-main>
                <v-container class="d-flex justify-center align-center" style="min-height: 80vh;">
                    <!-- v-card — красивая карточка -->
                    <v-card class="pa-6" elevation="10" width="400" rounded="lg">
                        <v-card-title class="text-h4 text-center">Кликер</v-card-title>
                        <!-- Счётчик с огромным шрифтом и жирностью -->
                        <v-card-text class="text-h1 text-center font-weight-black my-4">
                            {{ score }}
                        </v-card-text>
                        <!-- Блок с кнопками и иконками -->
                        <v-card-actions class="justify-center">
                            <v-btn color="primary" size="large" @click="increment">
                                Нажать!
                                <v-icon end icon="mdi-gamepad-variant"></v-icon>
                            </v-btn>
                            <v-btn color="error" size="large" @click="resetScore">
                                Сброс
                                <v-icon end icon="mdi-reload"></v-icon>
                            </v-btn>
                        </v-card-actions>
                        <!-- Сообщение, которое красиво анимируется -->
                        <v-card-text class="text-center mt-2" v-if="showCheer">
                            <v-alert type="success" variant="tonal" closable>
                                Ура! Вы нажали 10 раз!
                            </v-alert>
                        </v-card-text>
                    </v-card>
                </v-container>
            </v-main>
        </v-app>
    </div>

    <!-- Подключаем Vue -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- Подключаем Vuetify -->
    <script src="https://cdn.jsdelivr.net/npm/vuetify@3.3.0/dist/vuetify.min.js"></script>
    <script>
        const { createApp, ref } = Vue;
        
        // Создаём экземпляр Vuetify (это обязательно!)
        const vuetify = Vuetify.createVuetify();

        // Создаём приложение
        const app = createApp({
            setup() {
                // Реактивные данные: счёт и флаг для показа сообщения
                const score = ref(0);
                const showCheer = ref(false);
                let cheerTimeout = null;

                // Функция для увеличения счёта
                const increment = () => {
                    score.value++;
                    // Если набрали 10 очков, показываем сообщение
                    if (score.value === 10) {
                        showCheer.value = true;
                        // Автоматически скрываем сообщение через 3 секунды
                        clearTimeout(cheerTimeout);
                        cheerTimeout = setTimeout(() => {
                            showCheer.value = false;
                        }, 3000);
                    }
                };

                // Функция для сброса счёта
                const resetScore = () => {
                    score.value = 0;
                    showCheer.value = false;
                    if (cheerTimeout) clearTimeout(cheerTimeout);
                };

                return { score, showCheer, increment, resetScore };
            }
        });

        //Подключаем Vuetify к нашему приложению
        app.use(vuetify);
        app.mount('#app');
    </script>
</body>
</html>
