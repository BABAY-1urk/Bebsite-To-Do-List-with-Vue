<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>to-do list</title>
</head>
<body>
<div id="app">
  <h2>Список дел</h2>
  <input v-model="newTask" placeholder="Новая задача">
  <button @click="addTask">Добавить</button>
  <ul>
    <li v-for="(task, idx) in tasks" :key="idx">
      {{ task }}
      <button @click="removeTask(idx)">Удалить</button>
    </li>
  </ul>
</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script>
  const { createApp, ref } = Vue;
  createApp({
    setup() {
      const newTask = ref('');
      const tasks = ref(['Сделать сальто', 'Прыгнуть выше головы']);
      
      function addTask() {
        if (newTask.value.trim() !== '') {
          tasks.value.push(newTask.value);
          newTask.value = '';
        }
      }
      function removeTask(index) {
        tasks.value.splice(index, 1);
      }
      
      return { newTask, tasks, addTask, removeTask };
    }
  }).mount('#app');
</script>
</body>
</html>
